name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

jobs:
  build-linux-packages:
    name: Build DEB and RPM (Linux)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'
          cache: 'maven'

      - name: Install Packaging Tools (fakeroot, rpm)
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm

      - name: Build Fat JAR with Maven
        run: mvn clean package -DskipTests

      - name: Extract Version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="1.0.0"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Package DEB with jpackage
        run: |
          jpackage \
            --type deb \
            --input target \
            --name bcftopdf \
            --main-jar BcfToPdfTool-1.0.0.jar \
            --main-class com.bcf.Main \
            --app-version "${{ steps.get_version.outputs.VERSION }}" \
            --dest dist \
            --linux-shortcut \
            --linux-menu-group "Office;Graphics;" \
            --description "BIM Collaboration Format (BCF) to PDF Converter" \
            --vendor "OpusUmbrae"

      - name: Package RPM with jpackage
        run: |
          jpackage \
            --type rpm \
            --input target \
            --name bcftopdf \
            --main-jar BcfToPdfTool-1.0.0.jar \
            --main-class com.bcf.Main \
            --app-version "${{ steps.get_version.outputs.VERSION }}" \
            --dest dist \
            --linux-shortcut \
            --linux-menu-group "Office;Graphics;" \
            --description "BIM Collaboration Format (BCF) to PDF Converter" \
            --vendor "OpusUmbrae"

      - name: Rename Linux Packages
        run: |
          cd dist
          mv *.deb bcftopdf-${{ steps.get_version.outputs.VERSION }}-linux-amd64.deb || true
          mv *.rpm bcftopdf-${{ steps.get_version.outputs.VERSION }}-linux-x86_64.rpm || true

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*

  build-windows-exe:
    name: Build EXE Installer (Windows)
    runs-on: windows-2022

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'
          cache: 'maven'

      - name: Build Fat JAR with Maven
        run: mvn clean package -DskipTests

      - name: Extract Version
        id: get_version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="1.0.0"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Package Windows EXE with jpackage
        shell: bash
        run: |
          mkdir -p dist
          jpackage \
            --type exe \
            --input target \
            --name BcfToPdfTool \
            --main-jar BcfToPdfTool-1.0.0.jar \
            --main-class com.bcf.Main \
            --app-version "${{ steps.get_version.outputs.VERSION }}" \
            --dest dist \
            --win-dir-chooser \
            --win-menu \
            --win-shortcut \
            --description "BIM Collaboration Format (BCF) to PDF Converter" \
            --vendor "OpusUmbrae"

      - name: Rename Windows Package
        shell: bash
        run: |
          cd dist
          mv *.exe BcfToPdfTool-${{ steps.get_version.outputs.VERSION }}-windows-x64-setup.exe || true

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/*

  release:
    name: Create GitHub Release
    needs: [build-linux-packages, build-windows-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: release_assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: release_assets

      - name: Determine Tag Name
        id: tag_name
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "TITLE=Release ${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "TAG=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "TITLE=Release v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=v1.0.0" >> $GITHUB_OUTPUT
            echo "TITLE=Release v1.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_name.outputs.TAG }}
          name: ${{ steps.tag_name.outputs.TITLE }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release_assets/*
